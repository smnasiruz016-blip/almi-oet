# CI — where the gates and the test suite actually run.
#
# WHY THIS FILE EXISTS. The runtime test suite was added to `gate:all`, which is
# inside `build`, which is what Vercel runs to deploy. That broke the production
# deploy of #14: Vercel runs the build step with NODE_ENV=production, React 19
# exports `act` only from its development build, and all 7 tests died on
# `TypeError: act is not a function`.
#
# almiworld_product_standard §4: "Gates do NOT belong in the Vercel deploy build
# — keep them in CI. Keep only fast, DB-free gates in the build." We wrote that
# rule and then broke it.
#
# Taking the suite out of the build is only half the fix. A suite with no home
# is a deleted proof, and the green that follows is worth nothing. This is the
# other half: the suite runs here, on every push and every pull request, and the
# run is the evidence.
#
# 🔴 NO DATABASE, AND NO GATE NEEDS A SECRET. Verified on 2026-09-01 by running
# every step with DATABASE_URL unset: run.ts, sources.ts, timing.tsx,
# validate-seed.ts, report-shape.ts and the vitest suite all exit 0 without it.
# `prisma generate` (postinstall) reads schema.prisma and does not contact the
# database. If a future gate needs a credential, move that gate out of this
# workflow — do not add a secret to make it pass.
#
# ⚠️ THE ONE CREDENTIAL, AND IT IS NOT FOR A GATE. `npm ci` cannot run at all
# without one: package.json depends on @smnasiruz016-blip/almi-data, which is
# published to GitHub Packages, and the repo's committed .npmrc already reads
# `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}`. The first CI run failed
# on exactly that — `npm error code E401 ... unauthenticated`.
#
# It is fed the automatic GITHUB_TOKEN, which Actions mints per run and destroys
# afterwards. Nobody stores it, nobody rotates it, and it is not in the repo's
# secrets. Its scope here is `packages: read` and `contents: read` and nothing
# else. This is the registry credential the install needs to exist; it is not a
# database URL and it is not an API key, and no gate below is passing because of
# it — every one of them was verified green with no environment at all.

name: CI

on:
  push:
  pull_request:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Explicit and minimal: this workflow reads code and a package, and writes
    # nothing. `packages: read` exists only so `npm ci` can fetch
    # @smnasiruz016-blip/almi-data from GitHub Packages.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # NODE_AUTH_TOKEN is scoped to THIS STEP ONLY. The gates, the tests and the
      # report all run below without it — they were verified green with no
      # environment at all, and nothing after this step can read it.
      - name: Install (npm ci)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npx tsc --noEmit

      # G1-G7, S1-S3, T1-T9, and the seed payload validator. All read
      # scripts/seed/gen and src/; none opens a connection.
      - name: Gates
        run: npm run gate:all

      # The three gates the "next exercise" chain brought with it, run BY NAME so
      # a failure in the CI log says which promise broke rather than "a test
      # failed". None of them opens a connection: gate:next-exercise drives the
      # pure picker, gate:pool-visible renders the real pages against a fake
      # Prisma, gate:chain-is-paid enumerates the entry module's exports and
      # reads the source tree.
      #
      # 🔴 THEY ARE DELIBERATELY NOT IN `gate:all`. gate:all runs inside `build`,
      # which Vercel runs with NODE_ENV=production, where React 19 does not
      # export `act` — the exact failure that broke the deploy of #14. Test gates
      # live here.
      #
      # `npm test` below runs these files again as part of the whole suite. The
      # duplication is the point: this step names them, that step guarantees they
      # cannot be dropped from the suite by deleting a line from this file.
      - name: Chain gates
        run: npm run gate:chain

      # The runtime behaviour suite — the only place React effects actually run.
      # It is NO LONGER part of `build`; this step is the only thing standing
      # between a dead countdown and production.
      - name: Runtime tests
        run: npm test

      # A report, not a gate: it always exits 0 and blocks nothing. It runs here
      # so the measured-vs-published shape of the bank is visible in the log of
      # every single run, instead of only when somebody remembers to ask.
      - name: Shape report
        run: npm run report:shape
